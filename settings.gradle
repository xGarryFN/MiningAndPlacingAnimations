pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://libraries.minecraft.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.architectury.loom' version '1.14-SNAPSHOT'
}

rootProject.name = 'mining_and_placing_animations'
include('common', 'fabric')
